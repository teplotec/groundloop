name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync Python dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check src tests apps/api
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest --cov=groundloop --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    needs: [python, web]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Install Python
        working-directory: .
        run: uv python install
      - name: Sync Python dependencies
        working-directory: .
        run: uv sync --dev
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke
        run: npm run test:e2e
